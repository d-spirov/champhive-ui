name: team_hive
description: "ChampHive - Sport club management by Codeantech."
homepage: https://codeantech.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0

  # HTTP / API
  dio: ^5.4.0

  # Local storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  url_launcher: ^6.3.1
  http_parser: ^4.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.1.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00A3F4"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/common/
    - assets/images/sports/basketball/
    - assets/images/sports/football/
    - assets/images/sports/volleyball/
    - assets/images/sports/generic/
    - assets/icon/
    - assets/brand/
